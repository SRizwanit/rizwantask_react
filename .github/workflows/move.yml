name: Move Files to admin folder

on:
  workflow_dispatch:

jobs:
  move-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"

      - name: Copy and Clean Files
        run: |
          # যদি admin ফোল্ডার আগে থেকে না থাকে তবে তৈরি করা
          mkdir -p rizwantask_react/src/pages/admin
          
          # Admin ফোল্ডারের ফাইলগুলো admin ফোল্ডারে কপি করা
          cp -r rizwantask_react/src/pages/Admin/ rizwantask_react/src/pages/admin/
          
          # পুরোনো বড় হাতের Admin ফোল্ডারটি গিট থেকে ডিলিট করা
          git rm -r rizwantask_react/src/pages/Admin
          
          # নতুন ফাইলগুলো যুক্ত করা
          git add rizwantask_react/src/pages/admin
          
          # কমিট ও পুশ করা
          git commit -m "Move all files from Admin to admin folder"
          git push
