name: Rename Folder Case

on:
  workflow_dispatch: # এটি গিটহাব পেজ থেকে ম্যানুয়ালি রান করানোর অপশন দেবে

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"

      - name: Fix folder case sensitivity
        run: |
          # গিট যেন কেস সেন্সিটিভিটি (বড়/ছোট হাতের অক্ষর) পরিবর্তন ধরতে পারে
          git config core.ignorecase false
          
          # ফোল্ডারটি রিনেইম করার জন্য গিট ক্যাশ থেকে সাময়িকভাবে রিমুভ করে আবার এড করা হচ্ছে
          git mv -f rizwantask_react/src/pages/Admin rizwantask_react/src/pages/admin_temp
          git mv -f rizwantask_react/src/pages/admin_temp rizwantask_react/src/pages/admin
          
          # পরিবর্তনগুলো কমিট ও পুশ করা
          git add .
          git commit -m "Fix: Rename Admin folder to admin"
          git push