name: Rename Folder Case

on:
  workflow_dispatch:

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"

      - name: Fix folder case sensitivity
        run: |
          # কেস সেন্সিটিভিটি অন করা
          git config core.ignorecase false
          
          # বর্তমান ফোল্ডারটি রিনেইম করার সঠিক কমান্ড (সাময়িক নাম দিয়ে)
          git mv rizwantask_react/src/pages/Admin rizwantask_react/src/pages/admin_temp
          git mv rizwantask_react/src/pages/admin_temp rizwantask_react/src/pages/admin
          
          # কমিট ও পুশ করা
          git add -A
          git commit -m "Fix: Rename Admin folder to admin"
          git push
